# ---------------------------------------------------------------------------
# Daily automated update
#
# Runs a custom update script on a schedule, and if it produced any changes,
# pushes them to a dedicated branch, opens a PR, and auto-merges it into main.
#
# Requirements:
#   - Settings > Actions > General > Workflow permissions:
#       "Read and write permissions" AND
#       "Allow GitHub Actions to create and approve pull requests"
#   - If branch protection on `main` requires status checks, enable
#     "Allow auto-merge" in repo settings; this workflow already falls back
#     to `--auto` merge in that case.
# ---------------------------------------------------------------------------
name: Daily Update

on:
  schedule:
    # 02:30 UTC every day (08:00 IST). Cron on GitHub is always UTC.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the update script but do not open or merge a PR'
        type: boolean
        default: false

# Never let two runs race on the same branch.
concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BASE_BRANCH: main
  UPDATE_BRANCH: automated/daily-update
  UPDATE_SCRIPT: ./scripts/update.sh

jobs:
  update:
    name: Run update and merge PR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          # Default GITHUB_TOKEN is fine here. Swap for a PAT/App token if you
          # need the PR to trigger other workflows (see README notes).
          token: ${{ secrets.GITHUB_TOKEN }}

      # Add language runtimes your script needs, e.g.:
      # - uses: actions/setup-node@v4
      #   with: { node-version: '20', cache: 'npm' }

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Recreate update branch from base
        run: |
          git checkout -B "$UPDATE_BRANCH" "origin/$BASE_BRANCH"

      - name: Run update script
        id: update
        run: |
          set -euo pipefail
          if [ ! -x "$UPDATE_SCRIPT" ]; then
            echo "::error::Update script '$UPDATE_SCRIPT' is missing or not executable."
            exit 1
          fi
          "$UPDATE_SCRIPT"

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes produced by the update script."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "summary<<EOF"
              git diff --cached --stat
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          git commit -m "chore: automated daily update ($(date -u +'%Y-%m-%d'))"
          git push --force-with-lease origin "$UPDATE_BRANCH"

      - name: Create or update pull request
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != true
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGE_SUMMARY: ${{ steps.diff.outputs.summary }}
        run: |
          set -euo pipefail

          existing="$(gh pr list --head "$UPDATE_BRANCH" --base "$BASE_BRANCH" \
                        --state open --json number --jq '.[0].number // empty')"

          body="$(cat <<EOF
          Automated daily update generated by [\`${GITHUB_WORKFLOW}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          \`\`\`
          ${CHANGE_SUMMARY}
          \`\`\`
          EOF
          )"

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
            number="$existing"
          else
            # Create WITHOUT --label: a missing label makes `gh pr create` exit
            # non-zero (sometimes after the PR already exists), which would
            # otherwise produce duplicate-PR errors on the retry.
            number="$(gh pr create \
              --base "$BASE_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --title "chore: automated daily update ($(date -u +'%Y-%m-%d'))" \
              --body "$body" \
              | sed -n 's#.*/pull/\([0-9]*\).*#\1#p')"
            # Best-effort label; never fail the run over it.
            gh pr edit "$number" --add-label automated 2>/dev/null \
              || echo "Label 'automated' not applied (create it in the repo to enable)."
          fi

          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Pull request #$number is open."

      - name: Merge pull request and delete branch
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # Try an immediate squash merge; if required checks are still pending
          # or branch protection blocks it, queue it with auto-merge instead.
          if gh pr merge "$PR_NUMBER" --squash --delete-branch; then
            echo "Merged PR #$PR_NUMBER."
          else
            echo "Immediate merge blocked - enabling auto-merge."
            gh pr merge "$PR_NUMBER" --squash --delete-branch --auto
          fi

      - name: Job summary
        if: always()
        env:
          # Passed as env, never interpolated into the script body: a filename
          # containing quotes or backticks would otherwise break/inject bash.
          CHANGED: ${{ steps.diff.outputs.changed }}
          CHANGE_SUMMARY: ${{ steps.diff.outputs.summary }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          {
            echo "### Daily update"
            echo ""
            if [ "$CHANGED" = "true" ]; then
              echo "Merged PR #${PR_NUMBER:-(not created)}"
              echo ""
              echo '```'
              printf '%s\n' "$CHANGE_SUMMARY"
              echo '```'
            else
              echo "No changes detected - nothing to merge."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
