name: Daily Update

on:
  schedule:
    - cron: '30 2 * * *'      # 02:30 UTC = 08:00 IST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-update

env:
  BRANCH: automated/daily-update
  # Must be a VERIFIED email on your GitHub account, otherwise the commit
  # is not credited to you on your contribution graph.
  AUTHOR_NAME: brutal-45
  AUTHOR_EMAIL: creatorsports81@gmail.com

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run update script
        run: bash scripts/update.sh

      - name: Commit, open PR, merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Detected at runtime, so this file works on main or master unchanged.
          BASE=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
          echo "Base branch: $BASE"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes. Nothing to do."
            exit 0
          fi

          git config user.name  "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"

          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore: daily update $(date -u +'%Y-%m-%d')"
          git push --force origin "$BRANCH"

          url=$(gh pr create --base "$BASE" --head "$BRANCH" \
                  --title "chore: daily update $(date -u +'%Y-%m-%d')" \
                  --body "Automated update. Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                ) || url=$(gh pr list --head "$BRANCH" --json url --jq '.[0].url')

          echo "PR: $url"
          gh pr merge "$url" --squash --delete-branch
