name: Daily Update

on:
  schedule:
    - cron: '30 2 * * *'      # 02:30 UTC = 08:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update

env:
  AUTHOR_NAME: brutal-45
  AUTHOR_EMAIL: creatorsports81@gmail.com

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run update script
        run: bash scripts/update.sh

      - name: Commit and push
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes. Nothing to do."
            exit 0
          fi

          git config user.name  "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"

          git add -A
          git commit -m "chore: daily update $(date -u +'%Y-%m-%d')"

          # Rebase in case the branch moved while the job was running.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
